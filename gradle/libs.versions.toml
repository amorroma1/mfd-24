[versions]
agp = "8.3.0"
kotlin = "1.9.22"
composeCompiler = "1.5.8"
compose = "1.6.0"
wearCompose = "1.3.0"
watchface = "1.2.0"
healthServices = "1.0.0-rc01"
activityCompose = "1.8.2"
lifecycle = "2.7.0"
coreKtx = "1.12.0"
work = "2.9.0"
coroutines = "1.7.1"
junit = "4.13.2"
json = "20240303"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }

compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }

wear-compose-material = { module = "androidx.wear.compose:compose-material", version.ref = "wearCompose" }
wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wearCompose" }

watchface = { module = "androidx.wear.watchface:watchface", version.ref = "watchface" }
health-services = { module = "androidx.health:health-services-client", version.ref = "healthServices" }
watchface-style = { module = "androidx.wear.watchface:watchface-style", version.ref = "watchface" }
watchface-editor = { module = "androidx.wear.watchface:watchface-editor", version.ref = "watchface" }
watchface-complications-data-source-ktx = { module = "androidx.wear.watchface:watchface-complications-data-source-ktx", version.ref = "watchface" }

work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

junit = { module = "junit:junit", version.ref = "junit" }
# Real org.json on the unit-test classpath; the android.jar stub only returns defaults.
json = { module = "org.json:json", version.ref = "json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
